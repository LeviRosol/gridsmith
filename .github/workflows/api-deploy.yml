name: API Deploy

on:
  push:
    branches-ignore:
      - main
    paths:
      - "infra/api/**"
      - "scripts/deploy-api.sh"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Target stage"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev-on-branch-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
      STRIPE_SECRET_ARN: ${{ secrets.STRIPE_SECRET_ARN }}
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      PUBLIC_APP_ORIGIN: ${{ secrets.PUBLIC_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check deploy prerequisites
        id: prereq
        run: |
          if [ -z "${AWS_ROLE_TO_ASSUME}" ] || [ -z "${STRIPE_SECRET_ARN}" ] || [ -z "${COGNITO_USER_POOL_ID}" ] || [ -z "${COGNITO_CLIENT_ID}" ] || [ -z "${PUBLIC_APP_ORIGIN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ -z "${AWS_ROLE_TO_ASSUME}" ]; then echo "Skipping deploy: AWS_ROLE_TO_ASSUME_DEV is not configured."; fi
            if [ -z "${STRIPE_SECRET_ARN}" ]; then echo "Skipping deploy: STRIPE_SECRET_ARN is not configured."; fi
            if [ -z "${COGNITO_USER_POOL_ID}" ] || [ -z "${COGNITO_CLIENT_ID}" ]; then echo "Skipping deploy: COGNITO_USER_POOL_ID / COGNITO_CLIENT_ID not configured."; fi
            if [ -z "${PUBLIC_APP_ORIGIN}" ]; then echo "Skipping deploy: PUBLIC_APP_ORIGIN not configured."; fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup AWS SAM
        if: steps.prereq.outputs.ready == 'true'
        uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials (dev)
        if: steps.prereq.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install dependencies
        if: steps.prereq.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Deploy API (dev)
        if: steps.prereq.outputs.ready == 'true'
        run: npm run deploy:api:dev

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.stage }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      STAGE: ${{ inputs.stage }}
      AWS_ROLE_TO_ASSUME: ${{ inputs.stage == 'prod' && secrets.AWS_ROLE_TO_ASSUME_PROD || inputs.stage == 'staging' && secrets.AWS_ROLE_TO_ASSUME_STAGING || secrets.AWS_ROLE_TO_ASSUME_DEV }}
      STRIPE_SECRET_ARN: ${{ secrets.STRIPE_SECRET_ARN }}
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      PUBLIC_APP_ORIGIN: ${{ secrets.PUBLIC_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check deploy prerequisites
        id: prereq
        run: |
          if [ -z "${AWS_ROLE_TO_ASSUME}" ] || [ -z "${STRIPE_SECRET_ARN}" ] || [ -z "${COGNITO_USER_POOL_ID}" ] || [ -z "${COGNITO_CLIENT_ID}" ] || [ -z "${PUBLIC_APP_ORIGIN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ -z "${AWS_ROLE_TO_ASSUME}" ]; then echo "Skipping deploy: role secret missing for stage '${STAGE}'."; fi
            if [ -z "${STRIPE_SECRET_ARN}" ]; then echo "Skipping deploy: STRIPE_SECRET_ARN is not configured."; fi
            if [ -z "${COGNITO_USER_POOL_ID}" ] || [ -z "${COGNITO_CLIENT_ID}" ]; then echo "Skipping deploy: Cognito id(s) not configured."; fi
            if [ -z "${PUBLIC_APP_ORIGIN}" ]; then echo "Skipping deploy: PUBLIC_APP_ORIGIN not configured."; fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup AWS SAM
        if: steps.prereq.outputs.ready == 'true'
        uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials (${{ env.STAGE }})
        if: steps.prereq.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install dependencies
        if: steps.prereq.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Deploy API (${{ env.STAGE }})
        if: steps.prereq.outputs.ready == 'true'
        run: npm run deploy:api -- --stage "${STAGE}"
