AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: GridSmith API (catalog + commerce scaffolding)

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev

  StripeSecretArn:
    Type: String
    Description: Secrets Manager secret ARN holding the Stripe API key (plain sk_... or JSON with STRIPE_SECRET_KEY)

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID (e.g. us-east-1_xxxx)

  CognitoAppClientId:
    Type: String
    Description: Cognito app client id (same value as SPA COGNITO_CLIENT_ID / Hosted UI app client)

  PublicAppOrigin:
    Type: String
    Description: Public site origin for Checkout success/cancel redirects (no trailing slash), e.g. https://www.example.com or http://localhost:4000

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 29
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage

Resources:
  GridSmithHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        AllowOrigins:
          - "*"

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/catalog/
      Handler: index.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref StripeSecretArn
      Environment:
        Variables:
          STRIPE_SECRET_ARN: !Ref StripeSecretArn
      Events:
        GetCatalog:
          Type: HttpApi
          Properties:
            ApiId: !Ref GridSmithHttpApi
            Path: /api/catalog/tile-packs
            Method: GET

  CheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/checkout-session/
      Handler: index.handler
      MemorySize: 256
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref StripeSecretArn
      Environment:
        Variables:
          STRIPE_SECRET_ARN: !Ref StripeSecretArn
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoAppClientId
          PUBLIC_APP_ORIGIN: !Ref PublicAppOrigin
      Events:
        CreateCheckoutSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref GridSmithHttpApi
            Path: /api/billing/checkout-session
            Method: POST

  CapabilitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/capabilities/
      Handler: index.handler
      MemorySize: 512
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref StripeSecretArn
      Environment:
        Variables:
          STRIPE_SECRET_ARN: !Ref StripeSecretArn
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoAppClientId
      Events:
        GetCapabilities:
          Type: HttpApi
          Properties:
            ApiId: !Ref GridSmithHttpApi
            Path: /api/capabilities/me
            Method: GET

Outputs:
  ApiBaseUrl:
    Description: Base URL for this stage
    Value: !Sub "https://${GridSmithHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  CatalogEndpoint:
    Description: Catalog endpoint URL
    Value: !Sub "https://${GridSmithHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/catalog/tile-packs"
